          - 6
          - 8
        points:
          type: array
          description: Ordered sensor points. Length must equal sensorCount.
          oneOf:
          - minItems: 6
            maxItems: 6
          - minItems: 8
            maxItems: 8
          items:
            $ref: '#/components/schemas/SensorPoint'
