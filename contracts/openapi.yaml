          type: boolean
        batteryPercent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Status battery_pct. 255(미보정/미측정)는 수신기가 null로 보냅니다.
        batteryMv:
          type: integer
          minimum: 0
          nullable: true
          description: Status battery_mv.
        firmwareVersion:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
          description: Status fw_major.fw_minor.fw_patch (예 0.2.0). 기기 firmwareVersion을 갱신합니다.
        rssi:
