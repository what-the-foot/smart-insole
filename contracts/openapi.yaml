          type: integer
          minimum: 0
        duplicateCount:
          type: integer
          minimum: 0
        rejectedCount:
          type: integer
          minimum: 0
        rejections:
          type: array
          items:
            $ref: '#/components/schemas/FrameRejection'
        lastSequenceByDevice:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        receivedAt:
          type: string
          format: date-time
    DeviceHeartbeatRequest:
      type: object
