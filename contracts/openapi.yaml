        meanStrideTimeMs:
          type: number
          minimum: 0
          nullable: true
          description: '(계약 1.2.0) 최신 분석 결과의 gaitSummary.meanStrideTimeMs. 결과가 없거나 rule-v1.3.0 이전 결과면 null.'
    ImuVector:
      type: array
      description: int16 3축 벡터 (x, y, z).
      minItems: 3
      maxItems: 3
      items:
        type: integer
        minimum: -32768
        maximum: 32767
    PressureFrameInput:
      type: object
      additionalProperties: false
      description: |
        schemaVersion 1.0 프레임은 필수 5개 필드만 허용합니다. 1.1 선택 필드를 1.0 배치에 넣으면
        해당 프레임은 `SCHEMA_FIELD_NOT_ALLOWED`로 거부됩니다. 값이 null인 키는 생략합니다.
      required:
      - deviceId
      - footSide
      - sequence
      - deviceTimeMs
      - sensorValues
      properties:
        deviceId:
          type: string
          format: uuid
        footSide:
          $ref: '#/components/schemas/FootSide'
        sequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: 단조 증가 u32. 수신기가 v1 u16을 펼쳐 보냅니다.
        deviceTimeMs:
          type: integer
          format: int64
          minimum: 0
        sensorValues:
          type: array
          description: RAW ADC 값. 상한은 세션 adcMax(현재 4095)이며 4095는 포화를 뜻합니다.
          oneOf:
          - minItems: 6
            maxItems: 6
          - minItems: 8
            maxItems: 8
          items:
            type: integer
            minimum: 0
            maximum: 4095
        protocolVersion:
          type: integer
          minimum: 1
          description: '(1.1) BLE 패킷 프로토콜 버전. 1 = Frame A/B, 2 = 단일 패킷.'
        receivedAt:
          type: string
          format: date-time
          description: '(1.1) 프레임별 수신기(PC) 수신 시각. 좌우 정렬 기준.'
        dataMode:
          allOf:
          - $ref: '#/components/schemas/DataMode'
          description: '(1.1) v2에서는 RAW 고정.'
        calibrated:
          type: boolean
          description: '(1.1) 기기 측 영점 보정 여부. v2에서는 false 고정.'
        imuAvailable:
          type: boolean
          description: '(1.1) IMU 값 유효 여부. flags의 IMU_ERROR(bit1)가 켜지면 백엔드가 false로 정규화합니다.'
        accelMg:
          allOf:
          - $ref: '#/components/schemas/ImuVector'
          description: '(1.1) 가속도 mg.'
        gyroDps10:
          allOf:
          - $ref: '#/components/schemas/ImuVector'
          description: '(1.1) 각속도 0.1 °/s.'
        flags:
          type: integer
          minimum: 0
          maximum: 255
          description: '(1.1, protocolVersion 2 이상) bit0 FSR_ERROR, bit1 IMU_ERROR, bit2 BATTERY_LOW, bit3..7 예약 0.'
    FrameBatchRequest:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - receiverId
      - sentAt
      - frames
      properties:
        schemaVersion:
          type: string
          enum:
          - '1.0'
          - '1.1'
        receiverId:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          maxLength: 100
        batchId:
          type: string
          minLength: 1
          maxLength: 100
          description: '(1.1) 수신기 Outbox 배치 식별자. 멱등성은 여전히 (session, device, sequence) 기준입니다.'
        sentAt:
          type: string
          format: date-time
        frames:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/PressureFrameInput'
    FrameRejection:
      type: object
      additionalProperties: false
      required:
      - frameIndex
      - code
      - message
      properties:
        frameIndex:
          type: integer
          minimum: 0
        code:
          type: string
        message:
          type: string
    FrameBatchResponse:
      type: object
      additionalProperties: false
      required:
      - acceptedCount
      - duplicateCount
      - rejectedCount
      - rejections
      - lastSequenceByDevice
      - receivedAt
      properties:
