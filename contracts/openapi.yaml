      type: object
      additionalProperties: false
      required:
      - score
      - level
      - missingFrameRate
      - flags
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        level:
          $ref: '#/components/schemas/QualityLevel'
        missingFrameRate:
          type: number
          minimum: 0
          maximum: 1
        flags:
          type: array
          description: |
            품질 플래그. 예: SEQUENCE_GAP, OUT_OF_ORDER, DEVICE_TIME_JUMP, SENSOR_STUCK_OR_SATURATED,
            LEFT/RIGHT_DATA_MISSING, LEFT/RIGHT_DATA_INCOMPLETE, LEFT/RIGHT_DEVICE_DISCONNECTED, INSUFFICIENT_DATA,
            SEQUENCE_WRAP_SUSPECTED, SAMPLE_RATE_MISMATCH, RECEIVER_UPLOAD_INCOMPLETE,
            FSR_ERROR_REPORTED, IMU_ERROR_REPORTED, BATTERY_LOW_REPORTED, FILTERED_DATA_MODE, LOW_DATA_QUALITY.
          items:
            type: string
    GaitSummary:
      type: object
      additionalProperties: false
      required:
      - validStepCount
      - cadence
      - leftContactTimeMs
      - rightContactTimeMs
      - symmetryIndex
      properties:
        validStepCount:
          type: integer
          nullable: true
          minimum: 0
          description: Number of valid contact events used by the analysis; null for legacy results.
        cadence:
          type: number
          minimum: 0
        leftContactTimeMs:
          type: number
          minimum: 0
        rightContactTimeMs:
          type: number
          minimum: 0
        symmetryIndex:
          type: number
          minimum: 0
        leftStrideTimeMs:
          type: number
          minimum: 0
          nullable: true
          description: '(rule-v1.3.0) 왼발 스트라이드 시간 추정값(ms). 같은 발의 연속 접촉 구간 시작-시작 간격(deviceTimeMs 기준)의 중앙값. 접촉 구간이 2개 미만이거나 이전 결과면 null. 접촉 구간 기반 추정값이며 임상 검증된 보행 주기가 아닙니다.'
        rightStrideTimeMs:
          type: number
          minimum: 0
          nullable: true
          description: '(rule-v1.3.0) 오른발 스트라이드 시간 추정값(ms). 정의는 leftStrideTimeMs와 같음. 접촉 구간이 2개 미만이거나 이전 결과면 null.'
        meanStrideTimeMs:
          type: number
          minimum: 0
          nullable: true
          description: '(rule-v1.3.0) 좌우 스트라이드 시간의 평균(ms). 둘 다 있으면 (left+right)/2, 한쪽만 있으면 그 값, 둘 다 null이면 null.'
    PressureDistribution:
      type: object
      additionalProperties: false
      required:
      - leftMedialRatio
      - leftLateralRatio
      - rightMedialRatio
      - rightLateralRatio
      - leftHeelRatio
      - rightHeelRatio
      - leftMidfootRatio
      - rightMidfootRatio
      - leftForefootRatio
      - rightForefootRatio
      - leftPeakPressure
      - rightPeakPressure
      - leftMeanCoP
      - rightMeanCoP
      properties:
        leftMedialRatio:
          type: number
          minimum: 0
          maximum: 1
        leftLateralRatio:
          type: number
          minimum: 0
          maximum: 1
        rightMedialRatio:
          type: number
          minimum: 0
          maximum: 1
        rightLateralRatio:
          type: number
          minimum: 0
          maximum: 1
        leftHeelRatio:
          type: number
          minimum: 0
          maximum: 1
        rightHeelRatio:
          type: number
          minimum: 0
          maximum: 1
        leftMidfootRatio:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        rightMidfootRatio:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
        leftForefootRatio:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Combined FOREFOOT and TOE pressure ratio for the left foot.
        rightForefootRatio:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          description: Combined FOREFOOT and TOE pressure ratio for the right foot.
        leftPeakPressure:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Maximum normalized left sensor value observed during the session.
        rightPeakPressure:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Maximum normalized right sensor value observed during the session.
        leftMeanCoP:
          nullable: true
          description: Pressure-weighted mean left center of pressure, or null when unavailable.
          allOf:
          - $ref: '#/components/schemas/CopPoint'
        rightMeanCoP:
          nullable: true
          description: Pressure-weighted mean right center of pressure, or null when unavailable.
          allOf:
          - $ref: '#/components/schemas/CopPoint'
        leftSensorSharePct:
          nullable: true
          description: '(rule-v1.2.0) 접촉 프레임 평균의 센서별 share(센서/전체합×100), 레이아웃 index 순, 합 100. 접촉 프레임이 없거나 이전 결과면 null.'
          allOf:
          - $ref: '#/components/schemas/SensorSharePct'
        rightSensorSharePct:
          nullable: true
          description: '(rule-v1.2.0) 오른발 센서별 share. 접촉 프레임이 없거나 이전 결과면 null.'
          allOf:
          - $ref: '#/components/schemas/SensorSharePct'
        leftLoadSharePct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: '(rule-v1.3.0) 좌우 신호 비율(왼발). 각 발의 접촉 프레임 평균 전체합을 L, R이라 할 때 L/(L+R)×100. 힘·체중이 아닌 상대 신호 비율이며, 어느 한 발이라도 접촉 구간이 없거나 이전 결과면 null. 양발 센서 수가 다르면 두 값 모두 null.'
        rightLoadSharePct:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: '(rule-v1.3.0) 좌우 신호 비율(오른발). R/(L+R)×100이며 leftLoadSharePct와 합이 100. 어느 한 발이라도 접촉 구간이 없거나 이전 결과면 null. 양발 센서 수가 다르면 두 값 모두 null.'
    SensorSharePct:
      type: array
      oneOf:
      - minItems: 6
        maxItems: 6
      - minItems: 8
        maxItems: 8
      items:
        type: number
        minimum: 0
        maximum: 100
    PatternResult:
      type: object
      additionalProperties: false
      description: |
        rule-v1.2.0 패턴 코드는 MEDIAL_LOAD_TENDENCY, LATERAL_LOAD_TENDENCY, LEFT_RIGHT_ASYMMETRY,
        LOW_HALLUX_SIGNAL, FOREFOOT_LOAD_TENDENCY, REARFOOT_LOAD_TENDENCY 6종의 부분집합이며
        PARTIALLY_OBSERVED 또는 REPEATEDLY_OBSERVED만 patterns에 포함됩니다.
      required:
      - code
      - severity
      - title
      - message
      - evidence
      properties:
        code:
          type: string
        severity:
          $ref: '#/components/schemas/PatternSeverity'
        title:
          type: string
        message:
          type: string
        evidence:
          type: string
        observationLevel:
          allOf:
          - $ref: '#/components/schemas/ObservationLevel'
          nullable: true
          description: rule-v1.2.0 이상. 이전 결과는 null.
        occurrenceRate:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
          description: observedCount / windowCount. 이전 결과는 null.
        observedCount:
          type: integer
          minimum: 0
          nullable: true
        windowCount:
          type: integer
          minimum: 0
          nullable: true
          description: 판정에 사용한 창(유효 걸음) 수. LEFT_RIGHT_ASYMMETRY는 좌우 걸음 쌍 수.
    ObservationSummaryItem:
      type: object
      additionalProperties: false
      required:
      - code
      - observationLevel
      - occurrenceRate
      - observedCount
      - windowCount
      properties:
        code:
          type: string
          enum:
          - MEDIAL_LOAD_TENDENCY
          - LATERAL_LOAD_TENDENCY
          - LEFT_RIGHT_ASYMMETRY
          - LOW_HALLUX_SIGNAL
          - FOREFOOT_LOAD_TENDENCY
          - REARFOOT_LOAD_TENDENCY
        observationLevel:
          $ref: '#/components/schemas/ObservationLevel'
        occurrenceRate:
          type: number
          minimum: 0
          maximum: 1
        observedCount:
          type: integer
          minimum: 0
        windowCount:
          type: integer
          minimum: 0
    RecommendationSummary:
      type: object
      additionalProperties: false
      required:
