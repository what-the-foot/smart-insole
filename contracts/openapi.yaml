          type: integer
          minimum: 0
          maximum: 7
        x:
          type: number
          minimum: 0
          maximum: 1
          description: Foot-local horizontal coordinate from medial (0) to lateral (1). The UI mirrors LEFT-foot coordinates for a bilateral wearer-facing view.
        y:
          type: number
          minimum: 0
          maximum: 1
          description: Foot-local vertical coordinate from toe (0) to heel (1).
        region:
          type: string
          enum:
          - HEEL
          - MIDFOOT
          - FOREFOOT
          - TOE
        medialLateral:
          type: string
          enum:
          - MEDIAL
          - CENTER
          - LATERAL
    SensorLayoutResponse:
      type: object
