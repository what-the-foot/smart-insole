spring:
  application:
    name: smart-insole-backend
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-request-size: 1MB

server:
  port: ${BACKEND_PORT:8080}
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  auth:
    jwt-issuer: smart-insole
    access-token-seconds: 3600
  realtime:
    publish-hz: 10
    disconnect-timeout: 2s
  receiver:
    max-request-bytes: 1048576
  ingestion:
    max-frames-per-batch: 200
    sequence-wrap-suspect-distance: 60000
    sample-rate-mismatch-tolerance: 0.30
    retry-after-seconds: 2
  analysis:
    algorithm-version: rule-v1.2.0
    defaults-are-functional-test-values: true
    # Fallback ADC scale only; every session snapshots devices.adc_max (4095 for new registrations).
    adc-max-value: 4095
    # Contact detection on the 0..100 normalised scale. With the 12-bit ADC the per-sensor value
    # (3.75 x 8 sensors = 30.0) is the proposed value pending unloaded/standing measurements.
    contact-total-threshold: 30.0
    contact-total-threshold-per-sensor: 3.75
    # rule-v1.2.0 per-window (valid step) thresholds; proposed values without clinical validation.
    asymmetry-threshold-percent: 10.0
    medial-ratio-threshold: 0.60
    lateral-ratio-threshold: 0.60
    forefoot-ratio-threshold: 0.60
    rearfoot-ratio-threshold: 0.55
    hallux-share-pct-threshold: 5.0
    # Observation level from the occurrence rate over valid-step windows.
    partial-observation-rate: 0.20
    repeated-observation-rate: 0.60
    min-observation-windows: 4
    poor-quality-score-threshold: 60
    max-attempts: 2
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
