spring:
  application:
    name: smart-insole-backend
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-request-size: 1MB

server:
  port: ${BACKEND_PORT:8080}
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  auth:
    jwt-issuer: smart-insole
    access-token-seconds: 3600
  realtime:
    publish-hz: 10
    disconnect-timeout: 2s
  receiver:
    max-request-bytes: 1048576
  analysis:
    algorithm-version: rule-v1.1.0
    defaults-are-functional-test-values: true
    contact-total-threshold: 20.0
    asymmetry-threshold-percent: 10.0
    medial-ratio-threshold: 0.60
    lateral-ratio-threshold: 0.60
    midfoot-ratio-threshold: 0.40
    short-contact-time-ms: 300.0
    poor-quality-score-threshold: 60
    max-attempts: 2
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
