spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_insole?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&rewriteBatchedStatements=true}
